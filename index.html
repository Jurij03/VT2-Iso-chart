<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VT2 ISO Evidence</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-24">

    <!-- Horní lišta -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 px-4 py-3 flex justify-between items-center shadow-md">
        <div>
            <h1 class="font-bold text-lg text-blue-400">VT2 ISO Evidence</h1>
            <p class="text-xs text-slate-400">Svařování a endoskopická kontrola</p>
        </div>
        <div class="flex gap-2">
            <button onclick="exportJSON()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg font-medium border border-slate-600">Záloha</button>
            <label class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg font-medium border border-slate-600 cursor-pointer">
                Obnovit <input type="file" id="importFile" onchange="importJSON(event)" class="hidden" accept=".json">
            </label>
        </div>
    </header>

    <!-- Hlavní obsah -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Tlačítko pro nové ISO -->
        <div>
            <button onclick="openNewIsoModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 text-sm active:scale-95 transition-transform">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                + Přidat novou izometrii (ISO)
            </button>
        </div>

        <!-- Filtr a vyhledávání -->
        <div class="relative">
            <input type="text" id="searchInput" oninput="renderApp()" placeholder="Hledat izometrii nebo svar..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500">
        </div>

        <!-- Seznam izometrií -->
        <div id="isoList" class="space-y-4">
            <!-- Dynamicky generováno -->
        </div>

    </main>

    <!-- MODAL: Přidání ISO -->
    <div id="isoModal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col justify-end sm:justify-center p-0 sm:p-4">
        <div class="bg-slate-800 w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl border border-slate-700 p-4 space-y-4">
            <h3 class="font-bold text-base text-slate-100">Nová izometrie</h3>
            
            <div>
                <label class="block text-xs text-slate-400 mb-1 font-semibold text-blue-400">Název / Číslo ISO:</label>
                <p class="text-[11px] text-slate-400 mb-2">Tip na iPhonu: Klikni do políčka a zvol ikonu skenování textu (rámeček s čárkami) pro okamžité přečtení z výkresu.</p>
                <input type="text" id="inputIsoName" placeholder="např. GSB-45-060-287-0,75-K153" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500 font-medium">
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="saveIsoEntry()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg text-sm shadow">Uložit ISO</button>
                <button onclick="closeIsoModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2.5 rounded-lg text-sm">Zrušit</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Přidání svarů (Rozsah 1-10) -->
    <div id="weldsModal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col justify-end sm:justify-center p-0 sm:p-4">
        <div class="bg-slate-800 w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl border border-slate-700 p-4 space-y-4">
            <h3 class="font-bold text-base text-slate-100">Přidat svary k ISO</h3>
            <p class="text-xs text-slate-400" id="weldsModalSub">ISO: -</p>
            
            <div>
                <label class="block text-xs text-slate-400 mb-1">Zadejte čísla svarů (např. 1-10 nebo 1, 3, 5-8):</label>
                <input type="text" id="inputWeldsRange" placeholder="1-10" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 font-mono focus:outline-none focus:border-blue-500">
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="confirmAddWelds()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg text-sm">Vygenerovat svary</button>
                <button onclick="closeWeldsModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2.5 rounded-lg text-sm">Zrušit</button>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('vt2_iso_db') || '[]');
        let currentIsoId = null;

        function saveData() {
            localStorage.setItem('vt2_iso_db', JSON.stringify(db));
            renderApp();
        }

        // --- SPRÁVA MODALŮ ---
        function openNewIsoModal() {
            document.getElementById('isoModal').classList.remove('hidden');
            document.getElementById('inputIsoName').value = '';
            setTimeout(() => {
                document.getElementById('inputIsoName').focus();
            }, 100);
        }

        function closeIsoModal() {
            document.getElementById('isoModal').classList.add('hidden');
        }

        function saveIsoEntry() {
            const isoName = document.getElementById('inputIsoName').value.trim();

            if (!isoName) {
                alert('Zadejte prosím název izometrie.');
                return;
            }

            let existing = db.find(item => item.isoName === isoName);
            if (!existing) {
                db.unshift({
                    id: Date.now().toString(),
                    isoName: isoName,
                    welds: []
                });
            }

            saveData();
            closeIsoModal();
        }

        // --- SPRÁVA SVARŮ ---
        function openWeldsModal(isoId) {
            currentIsoId = isoId;
            const iso = db.find(i => i.id === isoId);
            document.getElementById('weldsModalSub').innerText = `ISO: ${iso.isoName}`;
            document.getElementById('inputWeldsRange').value = '1-10';
            document.getElementById('weldsModal').classList.remove('hidden');
        }

        function closeWeldsModal() {
            document.getElementById('weldsModal').classList.add('hidden');
            currentIsoId = null;
        }

        function confirmAddWelds() {
            const rangeStr = document.getElementById('inputWeldsRange').value.trim();
            const iso = db.find(i => i.id === currentIsoId);
            if (!iso) return;

            let weldNumbers = parseRangeString(rangeStr);
            weldNumbers.forEach(num => {
                let weldName = `W${num < 10 ? '0' + num : num}`;
                if (!iso.welds.find(w => w.name === weldName)) {
                    iso.welds.push({
                        id: Date.now() + Math.random(),
                        name: weldName,
                        status: 'OK',
                        method: 'H',
                        photoNo: ''
                    });
                }
            });

            iso.welds.sort((a,b) => {
                let numA = parseInt(a.name.replace(/\D/g,'')) || 0;
                let numB = parseInt(b.name.replace(/\D/g,'')) || 0;
                return numA - numB;
            });

            saveData();
            closeWeldsModal();
        }

        function parseRangeString(str) {
            let result = new Set();
            let parts = str.split(',');
            parts.forEach(part => {
                part = part.trim();
                if (part.includes('-')) {
                    let [start, end] = part.split('-').map(n => parseInt(n.trim()));
                    if (!isNaN(start) && !isNaN(end)) {
                        for (let i = Math.min(start, end); i <= Math.max(start, end); i++) {
                            result.add(i);
                        }
                    }
                } else {
                    let num = parseInt(part);
                    if (!isNaN(num)) result.add(num);
                }
            });
            return Array.from(result);
        }

        function addSingleWeld(isoId) {
            const iso = db.find(i => i.id === isoId);
            let nextNum = iso.welds.length + 1;
            let weldName = `W${nextNum < 10 ? '0' + nextNum : nextNum}`;
            iso.welds.push({
                id: Date.now(),
                name: weldName,
                status: 'OK',
                method: 'H',
                photoNo: ''
            });
            saveData();
        }

        function deleteWeld(isoId, weldId) {
            const iso = db.find(i => i.id === isoId);
            iso.welds = iso.welds.filter(w => w.id !== weldId);
            saveData();
        }

        function deleteIso(isoId) {
            if (confirm('Opravdu chcete smazat celou izometrii se všemi svary?')) {
                db = db.filter(i => i.id !== isoId);
                saveData();
            }
        }

        function updateWeld(isoId, weldId, field, value) {
            const iso = db.find(i => i.id === isoId);
            const weld = iso.welds.find(w => w.id === weldId);
            if (weld) {
                weld[field] = value;
                if (field === 'method') {
                    if (!weld.photoNo.startsWith('F-') && !weld.photoNo.startsWith('H-')) {
                        weld.photoNo = value + '-' + weld.photoNo;
                    } else {
                        weld.photoNo = value + '-' + weld.photoNo.substring(2);
                    }
                }
                saveData();
            }
        }

        // --- VYKRESLENÍ APLIKACE ---
        function renderApp() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const listEl = document.getElementById('isoList');
            listEl.innerHTML = '';

            let filtered = db.filter(iso => {
                if (iso.isoName.toLowerCase().includes(query)) return true;
                return iso.welds.some(w => w.name.toLowerCase().includes(query) || w.photoNo.toLowerCase().includes(query));
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-12 bg-slate-800/50 rounded-2xl border border-slate-800">
                        <p class="text-slate-400 text-sm">Zatím žádná izometrie v evidenci.</p>
                        <p class="text-xs text-slate-500 mt-1">Klikněte nahoře na + Přidat novou izometrii.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(iso => {
                let card = document.createElement('div');
                card.className = "bg-slate-800 border
