<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VT2 ISO Evidence</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Scanner Library (html5-qrcode) -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-24">

    <!-- Horní lišta -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 px-4 py-3 flex justify-between items-center shadow-md">
        <div>
            <h1 class="font-bold text-lg text-blue-400">VT2 ISO Evidence</h1>
            <p class="text-xs text-slate-400">Svařování a endoskopická kontrola</p>
        </div>
        <div class="flex gap-2">
            <button onclick="exportJSON()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg font-medium border border-slate-600">Záloha</button>
            <label class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg font-medium border border-slate-600 cursor-pointer">
                Obnovit <input type="file" id="importFile" onchange="importJSON(event)" class="hidden" accept=".json">
            </label>
        </div>
    </header>

    <!-- Hlavní obsah -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Tlačítka pro akce -->
        <div class="grid grid-cols-2 gap-2">
            <button onclick="openScannerModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 text-sm active:scale-95 transition-transform">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
                Naskenovat ISO QR
            </button>
            <button onclick="addNewIsoManual()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3 px-4 rounded-xl border border-slate-700 flex items-center justify-center gap-2 text-sm active:scale-95 transition-transform">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                Zapsat ručně ISO
            </button>
        </div>

        <!-- Filtr a vyhledávání -->
        <div class="relative">
            <input type="text" id="searchInput" oninput="renderApp()" placeholder="Hledat izometrii nebo svar..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500">
        </div>

        <!-- Seznam izometrií -->
        <div id="isoList" class="space-y-4">
            <!-- Dynamicky generováno -->
        </div>

    </main>

    <!-- MODAL: QR Skenování / Přidání ISO -->
    <div id="isoModal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col justify-end sm:justify-center p-0 sm:p-4">
        <div class="bg-slate-800 w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl border border-slate-700 max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
                <h3 class="font-bold text-base text-slate-100" id="modalTitle">Naskenovat QR kód ISO</h3>
                <button onclick="closeIsoModal()" class="text-slate-400 hover:text-white p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <div class="p-4 overflow-y-auto space-y-4">
                <!-- Čtečka QR -->
                <div id="readerWrapper" class="space-y-2">
                    <div id="reader" class="w-full overflow-hidden rounded-xl bg-black aspect-square"></div>
                    <p class="text-xs text-slate-400 text-center">Namiřte kameru na QR kód výkresu.</p>
                </div>

                <!-- Formulář po naskenování nebo ručním zadání -->
                <div id="isoForm" class="space-y-3 pt-2">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Naskenovaný/Interní QR kód:</label>
                        <input type="text" id="inputQrRaw" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-300 font-mono">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1 font-semibold text-blue-400">Název / Číslo ISO na výkresu (např. GSB-45-060-287-0,75-K153):</label>
                        <input type="text" id="inputIsoName" placeholder="Zadejte nebo vložte název ISO..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500 font-medium">
                    </div>
                    <div class="pt-2 flex gap-2">
                        <button onclick="saveIsoEntry()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg text-sm shadow">Uložit izometrii</button>
                        <button onclick="closeIsoModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2.5 rounded-lg text-sm">Zrušit</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: Přidání svarů (Rozsah 1-10) -->
    <div id="weldsModal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col justify-end sm:justify-center p-0 sm:p-4">
        <div class="bg-slate-800 w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl border border-slate-700 p-4 space-y-4">
            <h3 class="font-bold text-base text-slate-100">Přidat svary k ISO</h3>
            <p class="text-xs text-slate-400" id="weldsModalSub">ISO: -</p>
            
            <div>
                <label class="block text-xs text-slate-400 mb-1">Zadejte čísla svarů (např. 1-10 nebo 1, 3, 5-8):</label>
                <input type="text" id="inputWeldsRange" placeholder="1-10" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 font-mono focus:outline-none focus:border-blue-500">
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="confirmAddWelds()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg text-sm">Vygenerovat svary</button>
                <button onclick="closeWeldsModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2.5 rounded-lg text-sm">Zrušit</button>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('vt2_iso_db') || '[]');
        let currentIsoId = null;
        let html5QrCode = null;
        let qrCodeMapping = JSON.parse(localStorage.getItem('vt2_qr_mapping') || '{}');

        function saveData() {
            localStorage.setItem('vt2_iso_db', JSON.stringify(db));
            localStorage.setItem('vt2_qr_mapping', JSON.stringify(qrCodeMapping));
            renderApp();
        }

        // --- SPRÁVA MODALŮ ---
        function openScannerModal() {
            document.getElementById('isoModal').classList.remove('hidden');
            document.getElementById('readerWrapper').classList.remove('hidden');
            document.getElementById('inputQrRaw').value = '';
            document.getElementById('inputIsoName').value = '';
            document.getElementById('modalTitle').innerText = 'Skenování QR kódu ISO';
            
            setTimeout(() => {
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                }
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText) => {
                        stopScanner();
                        onQrScanned(decodedText);
                    },
                    (error) => {}
                ).catch(err => {
                    console.log("Kameru nelze spustit:", err);
                });
            }, 300);
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(err => console.log(err));
            }
        }

        function closeIsoModal() {
            stopScanner();
            document.getElementById('isoModal').classList.add('hidden');
        }

        function addNewIsoManual() {
            document.getElementById('isoModal').classList.remove('hidden');
            document.getElementById('readerWrapper').classList.add('hidden');
            document.getElementById('inputQrRaw').value = 'RUČNÍ ZADÁNÍ';
            document.getElementById('inputIsoName').value = '';
            document.getElementById('modalTitle').innerText = 'Přidat ISO ručně';
        }

        function onQrScanned(rawText) {
            document.getElementById('inputQrRaw').value = rawText;
            document.getElementById('readerWrapper').classList.add('hidden');
            
            // Pokud už máme QR kód v paměti spárovaný s názvem, předvyplníme ho
            if (qrCodeMapping[rawText]) {
                document.getElementById('inputIsoName').value = qrCodeMapping[rawText];
            } else {
                document.getElementById('inputIsoName').value = '';
            }
        }

        function saveIsoEntry() {
            const raw = document.getElementById('inputQrRaw').value || 'RUČNÍ ZADÁNÍ';
            const isoName = document.getElementById('inputIsoName').value.trim();

            if (!isoName) {
                alert('Zadejte prosím název izometrie (např. GSB-45-060-287-0,75-K153).');
                return;
            }

            // Uložíme si paměť pro příští sken stejného QR kódu
            if (raw !== 'RUČNÍ ZADÁNÍ') {
                qrCodeMapping[raw] = isoName;
            }

            // Zda už ISO neexistuje
            let existing = db.find(item => item.isoName === isoName);
            if (!existing) {
                db.unshift({
                    id: Date.now().toString(),
                    rawQr: raw,
                    isoName: isoName,
                    welds: []
                });
            }

            saveData();
            closeIsoModal();
        }

        // --- SPRÁVA SVARŮ ---
        function openWeldsModal(isoId) {
            currentIsoId = isoId;
            const iso = db.find(i => i.id === isoId);
            document.getElementById('weldsModalSub').innerText = `ISO: ${iso.isoName}`;
            document.getElementById('inputWeldsRange').value = '1-10';
            document.getElementById('weldsModal').classList.remove('hidden');
        }

        function closeWeldsModal() {
            document.getElementById('weldsModal').classList.add('hidden');
            currentIsoId = null;
        }

        function confirmAddWelds() {
            const rangeStr = document.getElementById('inputWeldsRange').value.trim();
            const iso = db.find(i => i.id === currentIsoId);
            if (!iso) return;

            let weldNumbers = parseRangeString(rangeStr);
            weldNumbers.forEach(num => {
                let weldName = `W${num < 10 ? '0' + num : num}`;
                // Přidáme jen pokud ještě neexistuje
                if (!iso.welds.find(w => w.name === weldName)) {
                    iso.welds.push({
                        id: Date.now() + Math.random(),
                        name: weldName,
                        status: 'OK', // OK / NOK
                        method: 'H',  // F (Automat) / H (Ruka)
                        photoNo: ''
                    });
                }
            });

            // Seřadit svary podle čísel
            iso.welds.sort((a,b) => {
                let numA = parseInt(a.name.replace(/\D/g,'')) || 0;
                let numB = parseInt(b.name.replace(/\D/g,'')) || 0;
                return numA - numB;
            });

            saveData();
            closeWeldsModal();
        }

        function parseRangeString(str) {
            let result = new Set();
            let parts = str.split(',');
            parts.forEach(part => {
                part = part.trim();
                if (part.includes('-')) {
                    let [start, end] = part.split('-').map(n => parseInt(n.trim()));
                    if (!isNaN(start) && !isNaN(end)) {
                        for (let i = Math.min(start, end); i <= Math.max(start, end); i++) {
                            result.add(i);
                        }
                    }
                } else {
                    let num = parseInt(part);
                    if (!isNaN(num)) result.add(num);
                }
            });
            return Array.from(result);
        }

        function addSingleWeld(isoId) {
            const iso = db.find(i => i.id === isoId);
            let nextNum = iso.welds.length + 1;
            let weldName = `W${nextNum < 10 ? '0' + nextNum : nextNum}`;
            iso.welds.push({
                id: Date.now(),
                name: weldName,
                status: 'OK',
                method: 'H',
                photoNo: ''
            });
            saveData();
        }

        function deleteWeld(isoId, weldId) {
            const iso = db.find(i => i.id === isoId);
            iso.welds = iso.welds.filter(w => w.id !== weldId);
            saveData();
        }

        function deleteIso(isoId) {
            if (confirm('Opravdu chcete smazat celou izometrii se všemi svary?')) {
                db = db.filter(i => i.id !== isoId);
                saveData();
            }
        }

        function updateWeld(isoId, weldId, field, value) {
            const iso = db.find(i => i.id === isoId);
            const weld = iso.welds.find(w => w.id === weldId);
            if (weld) {
                weld[field] = value;
                // Pokud uživatel mění metodu na F nebo H, můžeme případně nastavit prefix fotky
                if (field === 'method') {
                    if (!weld.photoNo.startsWith('F-') && !weld.photoNo.startsWith('H-')) {
                        weld.photoNo = value + '-' + weld.photoNo;
                    } else {
                        weld.photoNo = value + '-' + weld.photoNo.substring(2);
                    }
                }
                saveData();
            }
        }

        // --- VYKRESLENÍ APLIKACE ---
        function renderApp() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const listEl = document.getElementById('isoList');
            listEl.innerHTML = '';

            let filtered = db.filter(iso => {
                if (iso.isoName.toLowerCase().includes(query) || iso.rawQr.toLowerCase().includes(query)) return true;
                return iso.welds.some(w => w.name.toLowerCase().includes(query) || w.photoNo.toLowerCase().includes(query));
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-12 bg-slate-800/50 rounded-2xl border border-slate-800">
                        <p class="text-slate-400 text-sm">Zatím žádná izometrie v evidenci.</p>
                        <p class="text-xs text-slate-500 mt-1">Naskenujte QR kód nebo zadejte ISO ručně.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(iso => {
                let card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-md space-y-3";
                
                let weldsHtml = '';
                iso.welds.forEach(w => {
                    weldsHtml += `
                        <div class="bg-slate-900/70 border border-slate-700/60 rounded-xl p-3 space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm text-blue-300">${w.name}</span>
                                <div class="flex items-center gap-1.5">
                                    <!-- OK / NOK -->
                                    <button onclick="updateWeld('${iso.id}', ${w.id}, 'status', '${w.status === 'OK' ? 'NOK' : 'OK'}')" 
                                        class="px-2.5 py-1 rounded-lg text-xs font-bold ${w.status === 'OK' ? 'bg-emerald-600/30 text-emerald-400 border border-emerald-500/40' : 'bg-rose-600/30 text-rose-400 border border-rose-500/40'}">
                                        ${w.status}
                                    </button>
                                    <!-- F / H -->
                                    <button onclick="updateWeld('${iso.id}', ${w.id}, 'method', '${w.method === 'F' ? 'H' : 'F'}')" 
                                        class="px-2.5 py-1 rounded-lg text-xs font-semibold ${w.method === 'F' ? 'bg-purple-600/30 text-purple-300 border border-purple-500/40' : 'bg-amber-600/30 text-amber-300 border border-amber-500/40'}" title="F = Automat, H = Ruka">
                                        ${w.method === 'F' ? 'F (Auto)' : 'H (Ruka)'}
                                    </button>
                                    <button onclick="deleteWeld('${iso.id}', ${w.id})" class="text-slate-500 hover:text-rose-400 p-1">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                    </button>
                                </div>
                            </div>
                            <!-- Číslo fotky -->
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-slate-400 font-medium">FOTO:</span>
                                <input type="text" value="${w.photoNo}" onchange="updateWeld('${iso.id}', ${w.id}, 'photoNo', this.value)" placeholder="např. 142 nebo F-042" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-slate-100 focus:outline-none focus:border-blue-500 font-mono">
                            </div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2 border-b border-slate-700 pb-3">
                        <div>
                            <h2 class="font-bold text-base text-slate-100">${iso.isoName}</h2>
                            <p class="text-xs text-slate-500 font-mono">QR: ${iso.rawQr}</p>
                        </div>
                        <button onclick="deleteIso('${iso.id}')" class="text-slate-500 hover:text-rose-400 p-1">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>

                    <div class="space-y-2">
                        ${weldsHtml.length > 0 ? weldsHtml : '<p class="text-xs text-slate-500 italic">Zatím žádné svary. Přidejte rozsah nebo jednotlivé svary.</p>'}
                    </div>

                    <div class="pt-2 flex gap-2">
                        <button onclick="openWeldsModal('${iso.id}')" class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs font-semibold py-2 px-3 rounded-xl border border-slate-600 text-center">
                            + Přidat rozsah (1-10)
                        </button>
                        <button onclick="addSingleWeld('${iso.id}')" class="bg-slate-700 hover:bg-slate-600 text-xs font-semibold py-2 px-3 rounded-xl border border-slate-600">
                            + Svar
                        </button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // --- EXPORT / IMPORT ---
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({db, qrCodeMapping}, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `vt2_evidence_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importJSON(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed.db) {
                            db = parsed.db;
                            qrCodeMapping = parsed.qrCodeMapping || {};
                            saveData();
                            alert('Data byla úspěšně obnovena!');
                        }
                    } catch (err) {
                        alert('Chyba při čtení souboru.');
                    }
                };
            }
        }

        // Inicializace při startu
        renderApp();
    </script>
</body>
</html>
