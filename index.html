<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14141c">
<title>ISO Kontroly</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#14141c;color:#ececf1;
 padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top h1{font-size:19px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{background:none;border:none;color:#8f7bff;font-size:24px;line-height:1;padding:2px 10px}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:600;
 background:#8f7bff;color:#fff;cursor:pointer;margin-top:8px}
.btn.sec{background:#2a2a3a;color:#ececf1}
.btn.ok{background:#22a06b}.btn.nok{background:#d63a3a}
.btn.dim{opacity:.35}
input[type=text]{width:100%;background:#252533;border:1px solid #34344a;border-radius:10px;
 color:#ececf1;padding:12px;font-size:16px;margin-top:6px}
label.fld{display:block;font-size:13px;color:#9a9ab0;margin-top:12px}
.card{background:#1e1e2a;border:1px solid #2a2a3c;border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.list-item{cursor:pointer}
.badge{font-weight:700;font-size:13px;background:#34344a;border-radius:8px;padding:3px 9px}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.chip.ok{background:#134e35;color:#3dd68c}.chip.nok{background:#5a1d1d;color:#ff7a7a}
.chip.pend{background:#33333f;color:#9a9ab0}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;
 border-radius:50%;background:#8f7bff;color:#fff;font-size:32px;border:none;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.photo{width:100%;border-radius:10px;margin-top:8px}
.seg{display:flex;gap:8px;margin-top:6px}
.seg button{flex:1;padding:11px;border-radius:10px;border:1px solid #34344a;background:#252533;color:#9a9ab0;font-size:15px;font-weight:600}
.seg button.on{background:#8f7bff;color:#fff;border-color:#8f7bff}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;z-index:50}
.sheet{background:#1e1e2a;border-radius:18px 18px 0 0;width:100%;max-height:85vh;overflow:auto;
 padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.muted{color:#9a9ab0;font-size:13px}
.line-opt{display:block;width:100%;text-align:left;background:#252533;border:none;border-radius:10px;color:#ececf1;padding:12px;margin-top:6px;font-size:15px}
.empty{text-align:center;color:#9a9ab0;padding:60px 20px}
.delete{background:none;border:none;color:#ff7a7a;font-size:22px;padding:4px 8px}
.loader{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:99}
.loader div{background:#1e1e2a;border-radius:14px;padding:20px 26px;font-size:15px}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
/* ---------- data ---------- */
const LS='iso_records_v1';
let records;
try{records=JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){records=[]}
const save=()=>localStorage.setItem(LS,JSON.stringify(records));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* rozparsuje "1-10", "1,3,5", "1-3,7" */
function parseRange(str){
  const out=new Set();
  str.split(/[,;\s]+/).forEach(p=>{
    const m=p.match(/^(\d+)\s*-\s*(\d+)$/);
    if(m){const a=+m[1],b=+m[2];if(a<=b&&b-a<2000)for(let i=a;i<=b;i++)out.add(i)}
    else if(/^\d+$/.test(p))out.add(+p);
  });
  return [...out].sort((a,b)=>a-b);
}

/* ---------- fotky: IndexedDB ---------- */
function photoDB(){return new Promise((res,rej)=>{const r=indexedDB.open('iso_photos',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('photos');
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const photoPut=(id,data)=>photoDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(data,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}));
const photoGet=id=>photoDB().then(db=>new Promise((res,rej)=>{const rq=db.transaction('photos').objectStore('photos').get(id);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)}));
const photoDel=id=>photoDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}));

/* soubor z kamery zmenši a převeď na JPEG */
function fileToJPEG(file,maxDim,q){return new Promise((res,rej)=>{
  const img=new Image();
  img.onload=()=>{
    const s=Math.min(1,maxDim/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(img.src);
    res(c.toDataURL('image/jpeg',q));
  };
  img.onerror=()=>rej(new Error('Obrázek nelze přečíst.'));
  img.src=URL.createObjectURL(file);
})}
function capture(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.capture='environment';i.onchange=()=>i.files[0]&&cb(i.files[0]);i.click()}

/* ---------- loader ---------- */
let loaderEl=null;
function showLoader(t){loaderEl=document.createElement('div');loaderEl.className='loader';loaderEl.innerHTML='<div>'+esc(t)+'</div>';document.body.appendChild(loaderEl)}
function setLoader(t){if(loaderEl)loaderEl.firstChild.textContent=t}
function hideLoader(){if(loaderEl)loaderEl.remove();loaderEl=null}

/* ---------- OCR (rozpoznání názvu z fotky výkresu) ---------- */
function ensureTesseract(){return new Promise((res,rej)=>{
  if(window.Tesseract)return res();
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  s.onload=res;s.onerror=()=>rej(new Error('OCR se nepovedlo stáhnout – jsi online?'));
  document.head.appendChild(s)})}
function scanInto(setName){
  capture(async f=>{
    showLoader('Připravuji OCR…');
    try{
      await ensureTesseract();
      const url=await fileToJPEG(f,1700,.8);
      const r=await Tesseract.recognize(url,'eng',{logger:m=>{
        if(m.status==='recognizing text')setLoader('Čtu text… '+Math.round(m.progress*100)+'%');
      }});
      const lines=r.data.text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>=2);
      hideLoader();
      pickLine(lines,url,setName);
    }catch(e){hideLoader();alert('Sken selhal: '+e.message+'\nZadej název ručně.')}
  });
}
function pickLine(lines,imgUrl,setName){
  const ov=document.createElement('div');ov.className='overlay';
  const sheet=document.createElement('div');sheet.className='sheet';
  sheet.innerHTML='<div class="row"><b>Vyber řádek s názvem</b><button class="btn sec" style="width:auto;margin:0" id="plClose">✕</button></div>'
    +'<img class="photo" src="'+imgUrl+'">'
    +(lines.length?'<p class="muted">Klepnutím na rozpoznaný řádek ho použiješ jako název ISO:</p>'
                  :'<p class="muted">Text nenalezen – zkus lepší světlo, menší vzdálenost, nebo zadej název ručně.</p>');
  lines.slice(0,12).forEach(l=>{
    const b=document.createElement('button');b.className='line-opt';b.textContent=l;
    b.onclick=()=>{setName(l);ov.remove()};sheet.appendChild(b);
  });
  ov.appendChild(sheet);document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov)ov.remove()};
  sheet.querySelector('#plClose').onclick=()=>ov.remove();
}

/* ---------- obrazovky ---------- */
const app=document.getElementById('app');
let route={v:'home'};
function go(v){route=v;render()}
function render(){
  const r=route;
  if(r.v==='home')renderHome();
  else if(r.v==='add')renderAdd();
  else if(r.v==='detail')renderDetail(r.id);
  else if(r.v==='weld')renderWeld(r.id,r.num);
  window.scrollTo(0,0);
}
function statusChip(w){return w.status==='ok'?'<span class="chip ok">OK</span>':w.status==='nok'?'<span class="chip nok">NOK</span>':'<span class="chip pend">—</span>'}

function renderHome(){
  let h='<div class="top"><h1>ISO Kontroly</h1></div>';
  if(!records.length){
    h+='<div class="empty">Žádné kontroly.<br>Klepnutím na + přidej první ISO výkres.</div>';
  }else{
    h+=records.map(rec=>{
      const done=rec.welds.filter(w=>w.status!=='pend').length;
      return '<div class="card list-item" data-open="'+rec.id+'"><div class="row">'
        +'<div><b>'+esc(rec.name)+'</b><div class="muted">'+rec.welds.length+' svarů · '
        +done+'/'+rec.welds.length+' zkontrolováno · '+new Date(rec.created).toLocaleDateString('cs')+'</div></div>'
        +'<button class="delete" data-del="'+rec.id+'">🗑</button></div></div>';
    }).join('');
  }
  h+='<button class="fab" id="add">+</button>';
  app.innerHTML=h;
  document.getElementById('add').onclick=()=>go({v:'add'});
  app.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>go({v:'detail',id:el.dataset.open}));
  app.querySelectorAll('[data-del]').forEach(el=>el.onclick=e=>{e.stopPropagation();delRec(el.dataset.del)});
}
function delRec(id){
  if(!confirm('Smazat celou kontrolu včetně fotek?'))return;
  const rec=records.find(r=>r.id===id);
  if(rec)rec.welds.forEach(w=>w.photo&&photoDel(w.photo));
  records=records.filter(r=>r.id!==id);save();render();
}

function renderAdd(){
  app.innerHTML=
    '<div class="top"><button class="back" id="bk">‹</button><h1>Nová kontrola</h1></div>'
    +'<div class="card">'
    +'<label class="fld">Název ISO výkresu</label>'
    +'<input type="text" id="nm" placeholder="např. ISO-12345-A" autocapitalize="characters">'
    +'<button class="btn sec" id="scan">📷 Skenovat název z výkresu</button></div>'
    +'<div class="card">'
    +'<label class="fld">Svary (např. 1-10 nebo 1-3,7)</label>'
    +'<input type="text" id="rg" inputmode="text" placeholder="1-10">'
    +'<label class="fld">Přednastavený typ všech svarů</label>'
    +'<div class="seg" id="ty"><button data-t="H" class="on">H – ruční</button><button data-t="F">F – automat</button></div></div>'
    +'<div class="card"><button class="btn" id="cr">✓ Vytvořit kontrolu</button>'
    +'<p class="muted" id="hint" style="display:none">Formát: 1-10 (rozsah), 1,3,5 (výčet), nebo kombinace 1-3,7</p></div>';
  let type='H';
  document.getElementById('bk').onclick=()=>go({v:'home'});
  document.getElementById('scan').onclick=()=>scanInto(t=>document.getElementById('nm').value=t);
  app.querySelectorAll('#ty button').forEach(b=>b.onclick=()=>{
    type=b.dataset.t;
    app.querySelectorAll('#ty button').forEach(x=>x.classList.toggle('on',x===b));
  });
  const rg=document.getElementById('rg');
  rg.oninput=()=>{document.getElementById('hint').style.display=parseRange(rg.value).length?'none':'block'};
  document.getElementById('cr').onclick=()=>{
    const name=document.getElementById('nm').value.trim();
    const nums=parseRange(rg.value);
    if(!name||!nums.length){alert('Zadej název výkresu a čísla svarů.');return}
    const rec={id:uid(),name:name,created:Date.now(),
      welds:nums.map(n=>({n:n,type:type,status:'pend',photo:null}))};
    records.unshift(rec);save();go({v:'detail',id:rec.id});
  };
}

function renderDetail(id){
  const rec=records.find(r=>r.id===id);
  if(!rec)return go({v:'home'});
  app.innerHTML='<div class="top"><button class="back" id="bk">‹</button><h1>'+esc(rec.name)+'</h1></div>'
    +rec.welds.map(w=>'<div class="card list-item" data-w="'+w.n+'"><div class="row"><b>Svar '+w.n+'</b>'
      +'<span class="badge">'+w.type+'</span>'+statusChip(w)+'</div></div>').join('')
    +'<button class="btn sec" id="csv" style="margin-top:14px">⬇ Export CSV (všechny kontroly)</button>';
  document.getElementById('bk').onclick=()=>go({v:'home'});
  app.querySelectorAll('[data-w]').forEach(el=>el.onclick=()=>go({v:'weld',id:id,num:+el.dataset.w}));
  document.getElementById('csv').onclick=exportCSV;
}

function renderWeld(id,num){
  const rec=records.find(r=>r.id===id);
  const w=rec&&rec.welds.find(x=>x.n===num);
  if(!w)return go({v:'detail',id:id});
  app.innerHTML='<div class="top"><button class="back" id="bk">‹</button><h1>Svar '+w.n+' · '+esc(rec.name)+'</h1></div>'
    +'<div class="card"><label class="fld">Typ svaření</label>'
    +'<div class="seg" id="ty"><button data-t="H"'+(w.type==='H'?' class="on"':'')+'>H – ruční</button>'
    +'<button data-t="F"'+(w.type==='F'?' class="on"':'')+'>F – automat</button></div></div>'
    +'<div class="card"><label class="fld">Výsledek kontroly</label>'
    +'<div style="display:flex;gap:8px;margin-top:6px">'
    +'<button class="btn ok'+(w.status==='ok'?'':' dim')+'" id="ok" style="margin:0">OK</button>'
    +'<button class="btn nok'+(w.status==='nok'?'':' dim')+'" id="nok" style="margin:0">NOK</button></div></div>'
    +'<div class="card"><label class="fld">Foto svaru</label>'
    +'<div id="ph"></div>'
    +'<button class="btn sec" id="take">📷 '+(w.photo?'Přefotit':'Vyfotit svar')+'</button>'
    +(w.photo?'<button class="btn sec" id="rm" style="color:#ff7a7a">🗑 Smazat foto</button>':'')
    +'</div>';
  document.getElementById('bk').onclick=()=>go({v:'detail',id:id});
  app.querySelectorAll('#ty button').forEach(b=>b.onclick=()=>{
    w.type=b.dataset.t;save();
    app.querySelectorAll('#ty button').forEach(x=>x.classList.toggle('on',x===b));
  });
  const setBtns=()=>{
    document.getElementById('ok').classList.toggle('dim',w.status!=='ok');
    document.getElementById('nok').classList.toggle('dim',w.status!=='nok');
  };
  document.getElementById('ok').onclick=()=>{w.status=w.status==='ok'?'pend':'ok';save();setBtns()};
  document.getElementById('nok').onclick=()=>{w.status=w.status==='nok'?'pend':'nok';save();setBtns()};
  const ph=document.getElementById('ph');
  if(w.photo)photoGet(w.photo).then(d=>{if(d)ph.innerHTML='<img class="photo" src="'+d+'">'});
  document.getElementById('take').onclick=()=>capture(async f=>{
    showLoader('Ukládám foto…');
    try{
      const url=await fileToJPEG(f,1500,.72);
      const pid=uid();await photoPut(pid,url);
      if(w.photo)photoDel(w.photo);
      w.photo=pid;save();hideLoader();render();
    }catch(e){hideLoader();alert(e.message)}
  });
  const rm=document.getElementById('rm');
  if(rm)rm.onclick=()=>{photoDel(w.photo);w.photo=null;save();render()};
}

function exportCSV(){
  const rows=[['ISO','Svar','Typ','Vysledek']];
  records.forEach(r=>r.welds.forEach(w=>rows.push([r.name,w.n,w.type,{ok:'OK',nok:'NOK',pend:''}[w.status]])));
  const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='iso_kontroly_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

if(location.protocol==='https:'&&'serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
render();
</script>
</body>
</html>
